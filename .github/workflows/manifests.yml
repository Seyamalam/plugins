name: Manifests

on:
  pull_request:
  push:
    branches: [main]

env:
  PLUGIN_SCHEMA_URL: https://raw.githubusercontent.com/ardia-browser/ardia/ai-plugin/apps/cli/tests/fixtures/plugin.schema.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save ajv@8
      - run: node scripts/check-manifests.mjs "$PLUGIN_SCHEMA_URL"
      - run: sh -n install.sh && sh install.sh --list
